StylesPath = .vale/styles
Packages = Google
MinAlertLevel = suggestion

Vocab = SpecMirror

[*.py]
BasedOnStyles = Google

[*.{md,yaml}]
BasedOnStyles = Google

; A mirror reproduces another publisher's text, so no rule runs in this tree.
[docs/references/**]
BasedOnStyles =

; The README each mirror writes is the writer's own prose, not the publisher's.
[docs/references/*/README.md]
BasedOnStyles = Google
