[project]
name = "dev-scripts"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4==4.15.0",
    "soupsieve==3.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]

[tool.pyright]
include = ["scripts"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
strictDictionaryInference = false
extraPaths = ["scripts", "scripts/tests/"]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/default-rules/
# default is no longer the legacy `["E4","E7","E9","F"]`

select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "RET",  # flake8-return
    "PERF", # perflint
    "PTH",  # flake8-use-pathlib
]
